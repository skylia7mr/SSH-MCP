[project]
name = "ssh-mcp"
version = "0.1.0"
description = "Local SSH workbench and MCP server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "asyncssh==2.24.1",
  "bashlex==0.18",
  "bcrypt>=4.3,<6",
  "fastapi>=0.115,<1",
  "mcp==2.3.0",
  "pydantic-settings>=2.7,<3",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.11,<1",
  "mypy>=1.15,<2",
]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# Both readers are awaited before the experiment's loop advances.
"tests/integration/sudo_experiment.py" = ["B023"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
